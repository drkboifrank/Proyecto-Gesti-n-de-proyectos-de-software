server {
    listen 80;
    server_name alfavidrioyaluminio.com www.alfavidrioyaluminio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name alfavidrioyaluminio.com www.alfavidrioyaluminio.com;

    ssl_certificate /etc/letsencrypt/live/alfavidrioyaluminio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alfavidrioyaluminio.com/privkey.pem;

    client_max_body_size 5M;

    location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://localhost:8003/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
